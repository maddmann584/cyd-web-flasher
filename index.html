<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Maddmann’s GIF Player</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>Maddmann’s GIF Player</h1>
    <p>Connect • Upload GIFs • Click to play</p>
  </header>

  <main class="card">
    <div class="row">
      <button id="connectBtn">Connect</button>
      <span id="status">Not connected</span>
    </div>

    <div class="row">
      <input id="fileInput" type="file" accept=".gif,image/gif"/>
      <button id="uploadBtn" disabled>Upload to SD</button>
      <button id="refreshBtn" disabled>Refresh</button>
    </div>

    <div id="uploadStatus" class="hint">Uploads go to /gifs</div>

    <h2>/gifs</h2>
    <div id="list" class="list"></div>

    <pre id="debug" class="debug">Debug:\n</pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
