<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CYD GIF Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CYD GIF Manager</h1>

  <div class="card">
    <button id="connectBtn">Connect</button>
    <span id="status">Not connected</span>
  </div>

  <div class="card">
    <h2>Upload GIF to SD</h2>
    <input id="fileInput" type="file" accept=".gif,image/gif">
    <button id="uploadBtn" disabled>Upload</button>
    <div class="small" id="uploadStatus">—</div>
  </div>

  <div class="card">
    <h2>GIFs on SD</h2>
    <button id="refreshBtn" disabled>Refresh List</button>
    <div id="list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
