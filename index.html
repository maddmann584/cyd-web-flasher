<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYD Firmware Installer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ESP Web Tools -->
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #22d3ee;
    }
    .box {
      max-width: 500px;
      margin: auto;
      background: #020617;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }
    esp-web-install-button {
      margin-top: 20px;
    }
    .note {
      margin-top: 20px;
      font-size: 0.9em;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>CYD SD GIF Manager</h1>
    <p>Flash firmware directly to your CYD ESP32 from the browser.</p>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Install Firmware</button>
    </esp-web-install-button>

    <p class="note">
      ✔ Works in Chrome / Edge<br>
      ✖ Not supported in Safari / Firefox
    </p>
  </div>

</body>
</html>
