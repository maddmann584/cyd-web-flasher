<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GIF Player</title>
  <link rel="stylesheet" href="style.css"/>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
  <header>
    <h1>GIF Player</h1>
    <p>Flash firmware • Connect • Upload • Play/Delete</p>
  </header>

  <main class="card">
    <h2>1) Flash firmware</h2>
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>

    <hr/>

    <h2>2) Connect</h2>
    <div class="row">
      <button id="connectBtn">Connect</button>
      <button id="reloadBtn" disabled>Reload</button>
      <span id="status">Not connected</span>
    </div>

    <div id="errorBox" class="error hidden"></div>

    <div class="row">
      <input id="fileInput" type="file" accept=".gif,image/gif"/>
      <button id="uploadBtn" disabled>Upload</button>
    </div>

    <div class="progressWrap">
      <div class="progressBar" id="progressBar"></div>
    </div>
    <div id="uploadStatus" class="hint">Connect to load your GIFs</div>

    <h2>Your GIFs</h2>
    <div id="list" class="list"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
