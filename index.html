<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GIF Player</title>
  <link rel="stylesheet" href="style.css"/>

  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
  <header>
    <h1>GIF Player</h1>
    <p>Flash firmware • Connect • Upload • Tap to play</p>
  </header>

  <main class="card" id="card">
    <section class="block">
      <div class="row between">
        <div>
          <h2>Flash</h2>
          <div class="hint">Chrome/Edge • HTTPS (or localhost) • Close Arduino Serial Monitor first</div>
        </div>
        <div class="flashWrap">
          <esp-web-install-button id="flashBtn" manifest="manifest.json"></esp-web-install-button>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="block">
      <div class="row between">
        <div>
          <h2>Connect</h2>
          <div id="status" class="status">Not connected</div>
        </div>
        <button id="connectBtn" class="btn primary">Connect</button>
      </div>

      <div class="row wrap">
        <input id="fileInput" class="file" type="file" accept=".gif,image/gif"/>
        <button id="uploadBtn" class="btn" disabled>Upload</button>
      </div>

      <div id="uploadStatus" class="hint">Choose a GIF, then Upload.</div>
      <div id="errorBox" class="error hidden"></div>
    </section>

    <div class="divider"></div>

    <section class="block">
      <div class="row between">
        <h2>Your GIFs</h2>
        <div class="pill">Scroll when full</div>
      </div>

      <div id="grid" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
